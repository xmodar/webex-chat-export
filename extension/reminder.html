<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export the meeting chat?</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="page">
  <h1>Export the meeting chat?</h1>
  <p id="intro">The meeting tab was closed before its chat was exported.</p>

  <div class="card">
    <p class="meeting" id="meeting"></p>
    <p class="muted" id="when"></p>
    <ul id="convs"></ul>
  </div>
  <p class="hint">This is what the chat panel showed while the meeting was open. Direct chats you never opened, and messages from before the extension was running, aren't included.</p>

  <fieldset class="format">
    <legend>Format</legend>
    <label><input type="radio" name="format" value="xlsx" checked> Excel (.xlsx)</label>
    <label><input type="radio" name="format" value="json"> JSON</label>
  </fieldset>

  <details>
    <summary>Options</summary>
    <label class="field">Show your messages as
      <input type="text" id="myName" placeholder="your name from the participants list">
    </label>
    <label class="field">Time zone (for the date)
      <input type="text" id="timezone">
    </label>
    <label class="field">Sheet direction
      <select id="direction">
        <option value="auto">Automatic (from the messages)</option>
        <option value="ltr">Left to right</option>
        <option value="rtl">Right to left</option>
      </select>
    </label>
  </details>

  <button id="export" type="button">Export…</button>
  <div class="row">
    <button id="later" type="button" class="secondary">Not now</button>
    <button id="discard" type="button" class="secondary danger">Discard</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>

  <script src="vendor/browser-polyfill.min.js"></script>
  <script src="lib/merge.js"></script>
  <script src="options.js"></script>
  <script src="reminder.js"></script>
</body>
</html>
