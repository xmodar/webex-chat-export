<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webex Chat Export</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Webex Chat Export</h1>

  <fieldset class="format">
    <legend>Format</legend>
    <label><input type="radio" name="format" value="xlsx" checked> Excel (.xlsx)</label>
    <label><input type="radio" name="format" value="json"> JSON</label>
  </fieldset>

  <label class="check"><input type="checkbox" id="includeDirect" checked> Include direct (private) chats</label>

  <details>
    <summary>Options</summary>
    <label class="field">Show your messages as
      <input type="text" id="myName" placeholder="your name from the participants list">
    </label>
    <label class="field">Time zone (for the date)
      <input type="text" id="timezone">
    </label>
    <label class="field">Sheet direction
      <select id="direction">
        <option value="auto">Automatic (from the messages)</option>
        <option value="ltr">Left to right</option>
        <option value="rtl">Right to left</option>
      </select>
    </label>
  </details>

  <button id="export" type="button">Export chat…</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="hint">Keep this tab on the meeting while it runs: the chat panel is scrolled and each direct chat is opened in turn. You'll be asked where to save the file.</p>

  <section id="unsaved" hidden>
    <h2>Not exported yet</h2>
    <ul id="unsavedList"></ul>
  </section>

  <script src="vendor/browser-polyfill.min.js"></script>
  <script src="lib/merge.js"></script>
  <script src="options.js"></script>
  <script src="popup.js"></script>
</body>
</html>
