# Tests every push. On a version tag (v1.2.3) it also builds both packages,
# attaches them to a GitHub release, and publishes to the stores whose
# secrets are set:
#   Firefox Add-ons:   AMO_JWT_ISSUER, AMO_JWT_SECRET
#   Chrome Web Store:  CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
# A store whose secrets are missing is skipped.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run lint

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches the manifest version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != manifest v$v"; exit 1; }

      - run: npm run build

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber

      - name: Firefox Add-ons (listed)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: >
          npx --yes web-ext@8 sign --channel listed
          --source-dir dist/firefox
          --amo-metadata store/amo-metadata.json
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          --approval-timeout 0

      - name: Chrome Web Store
        if: env.CWS_EXTENSION_ID != '' && env.CWS_REFRESH_TOKEN != ''
        run: >
          npx --yes chrome-webstore-upload-cli@3
          --source "dist/webex-chat-export-${GITHUB_REF_NAME#v}-chrome.zip"
          --extension-id "$CWS_EXTENSION_ID"
          --client-id "$CWS_CLIENT_ID" --client-secret "$CWS_CLIENT_SECRET"
          --refresh-token "$CWS_REFRESH_TOKEN"
